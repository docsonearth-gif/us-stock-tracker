name: 美股 RS 每日計算

on:
  schedule:
    # GitHub 排程在整點、半點最擁擠，常延遲數小時；改用冷門分鐘，並排兩次（第二次是備援，沒有新資料就只重算）
    # 22:07 UTC = 台北 06:07（週二～週六）；23:13 UTC = 台北 07:13
    - cron: "7 22 * * 1-5"
    - cron: "13 23 * * 1-5"
  push:
    paths: ["run.txt"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          sudo apt-get update -q > /dev/null && sudo apt-get install -y -q fonts-noto-cjk > /dev/null
          pip install requests pandas openpyxl lxml yfinance weasyprint

      - name: 下載行情（EODHD Bulk；第一次會回補歷史）
        run: |
          mkdir -p logs
          set -o pipefail
          python fetch_us.py 2>&1 | tee logs/fetch.log
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}

      - name: 個股分類（產業、主題 ETF 成分股；每週一次）
        continue-on-error: true
        run: |
          set -o pipefail
          python classify_us.py 2>&1 | tee logs/classify.log

      - name: 計算 RS、大盤廣度、板塊強度與熱圖
        run: |
          set -o pipefail
          python rs_us.py 2>&1 | tee logs/rs.log
          python heatmap.py 2>&1 | tee -a logs/rs.log

      - name: Market Monitor
        run: |
          set -o pipefail
          python mm_us.py 2>&1 | tee logs/mm.log

      - name: 類股／主題 ETF 強度與 RSI
        continue-on-error: true
        run: |
          set -o pipefail
          python etf_us.py 2>&1 | tee logs/etf.log
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}

      - name: 每日報告（PDF）
        run: |
          set -o pipefail
          python report_us.py 2>&1 | tee logs/report.log
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      - name: 存檔到 repo
        if: always()
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add -A data/ logs/ || true
          git add RS_美股.xlsx Market_Monitor_美股.xlsx ETF強度_美股.xlsx 板塊RSI_熱圖_美股.xlsx sectors_us.csv report/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "US RS $(date -u +%F)"
          for i in 1 2 3; do
            git push && break
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done
